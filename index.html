<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F2EE">
<meta name="apple-mobile-web-app-title" content="84 Days">

<title>84 Days — HIFT Tracker</title>
<style>
:root{
  --paper:#F1F2EE; --card:#FFFFFF; --ink:#161A1D; --mut:#66707A; --line:#E4E7E1;
  --acc:#0E4DA4; --accSoft:#E6EEFA;
  --p:#2E6BE6; --c:#DE9A1B; --f:#E25C4A; --ok:#1E9E6A; --bad:#C9342A; --warnbg:#FBF3E2; --badbg:#FBE9E7; --okbg:#E7F6EF;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.small{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
button{font:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;
  font-weight:700;border-radius:14px;padding:13px 16px;width:100%;font-size:16px;text-align:center}
.btn.sec{background:var(--accSoft);color:var(--acc)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accSoft);color:var(--acc)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:#8a5a06} .pill.bad{background:var(--badbg);color:var(--bad)}
.pill.ghostp{background:#fff;border:1px solid var(--line);color:var(--mut)}
/* day header */
.hero{padding:18px 4px 6px}
.hero .date{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
.hero .big span{color:var(--mut);font-weight:700;font-size:22px}
.ticks{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 11px);position:relative;overflow:hidden;margin:12px 0 4px}
.ticks i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--acc) 0 8px,transparent 8px 11px)}
/* macros */
.kcalNum{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--paper);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ink);transition:width .4s}
.bar.over i{background:var(--bad)}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.mini{background:var(--paper);border-radius:12px;padding:10px}
.mini b{font-size:17px;font-variant-numeric:tabular-nums}
.mini .bar{height:6px;background:#fff}
.mini.pP .bar i{background:var(--p)} .mini.pC .bar i{background:var(--c)} .mini.pF .bar i{background:var(--f)}
.mini .bar.over i{background:var(--bad)}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.bad{background:var(--badbg);color:var(--bad)} .alert.warn{background:var(--warnbg);color:#7c5104} .alert.ok{background:var(--okbg);color:var(--ok)}
/* lists */
.item{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.item:first-of-type{border-top:0}
.item .nm{font-weight:700;font-size:15px}
.item .macros{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.icoBtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.add{background:var(--accSoft);color:var(--acc);font-size:22px;line-height:1}
.del{color:var(--mut);font-size:18px}
.trash{background:var(--badbg);color:var(--bad);font-size:15px}
.yt{background:#FCE8E6;color:#CC0000}
.yt svg{width:16px;height:16px;fill:#CC0000}
.skipped .nm,.skipped .macros{color:var(--mut);text-decoration:line-through}
.eaten .nm{color:var(--ok)}
.stBtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--mut)}
.stBtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stBtn.off.on2{background:var(--paper);border-color:var(--mut);color:var(--mut)}
/* training */
.blockH{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.blockH:first-child{margin-top:2px}
.blockH .tag{color:var(--acc)}
.coach{font-size:13px;color:var(--mut);margin:0 0 4px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .nm{color:var(--mut);text-decoration:line-through}
.actual{font-size:13px;color:var(--acc);font-weight:700;margin-top:2px}
.detail{background:var(--paper);border-radius:12px;padding:10px;margin:8px 0 2px}
.rpes{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.rpes button{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:13px;text-align:center;display:flex;align-items:center;justify-content:center}
.rpes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dnav .nav{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
/* log */
.photoZone{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:#fff}
.photoZone img{max-width:100%;max-height:220px;border-radius:12px}
.spin{width:22px;height:22px;border:3px solid var(--accSoft);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* plan */
.wkpills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.wkpills button{flex:none;padding:8px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.wkpills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dayrow{width:100%;display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.dayrow:first-of-type{border-top:0}
.dow{width:44px;flex:none;text-align:center}
.dow b{display:block;font-size:17px}.dow span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
/* library */
.cath{margin:18px 0 2px}
.cath h3{font-size:16px}
.cath .small{margin-top:2px}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);z-index:40;
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mut);width:64px;text-align:center}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* toast / sheet */
#toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;display:none;
  border-radius:14px;padding:13px 15px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
#toast.bad{background:var(--bad);color:#fff}#toast.ok{background:var(--ok);color:#fff}#toast.warn{background:#B97A0F;color:#fff}#toast.info{background:var(--ink);color:#fff}
#ovl{position:fixed;inset:0;background:rgba(20,25,30,.4);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-radius:22px 22px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto}
#sheet.open{transform:none}
.gear{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.coachCard{background:linear-gradient(135deg,#0E4DA4,#0A3A7E);color:#fff;border:0}
.coachCard .tag{color:#BCD4F5}
.coachCard .small{color:#D5E3F7}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</nav>

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nice(ds){const d=new Date(ds+'T00:00:00');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]}
const START=new Date(DATA.start+'T00:00:00');

/* ================= storage (IndexedDB) ================= */
const S={persist:true,mem:new Map()};
const DB=(()=>{let p;
  function open(){if(!p)p=new Promise((res,rej)=>{const r=indexedDB.open('hift84',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)});return p}
  return{
    get:k=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv').objectStore('kv').get(k);
      t.onsuccess=()=>res(t.result===undefined?null:t.result); t.onerror=()=>rej(t.error)})),
    set:(k,v)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readwrite').objectStore('kv').put(v,k);
      t.onsuccess=()=>res(); t.onerror=()=>rej(t.error)}))
  };
})();
async function stGet(k){try{return await DB.get(k)}catch(e){S.persist=false;return S.mem.has(k)?S.mem.get(k):null}}
async function stSet(k,v){try{await DB.set(k,v)}catch(e){S.persist=false;S.mem.set(k,v)}}
const emptyLog=()=>({meals:[],water:0,note:'',planMeals:null,workout:null,acts:[],fuelSt:{}});
async function getLog(ds){const l=(await stGet('log:'+ds))||emptyLog();
  if(!('planMeals' in l))l.planMeals=null;if(!('workout' in l))l.workout=null;
  if(!Array.isArray(l.acts))l.acts=[];if(!l.fuelSt)l.fuelSt={};return l}
async function saveLog(ds,l){await stSet('log:'+ds,l)}

/* ---- extra sessions: energy model & per-day targets ---- */
function actKcal(a){const m=METS[a.type]||METS.Other;const met=m[INTS.indexOf(a.intensity)]??m[1];
  return Math.round(met*(settings.weight||87)*a.min/60)}
function actAdj(l){let k=0,c=0,w=0,maxEnd=0;
  for(const a of (l.acts||[])){const kc=actKcal(a);k+=kc;
    if(END.has(a.type)){c+=Math.round(kc*0.6/4);w+=a.min/60*0.5;maxEnd=Math.max(maxEnd,a.min)}}
  return{k,c,w:Math.round(w*4)/4,maxEnd}}
function dayTargets(di,l){const a=actAdj(l);
  const base=di||{kcal:2400,prot:150,wat:2.5,su:0};
  const fat=base.kcal?Math.round(base.kcal*0.28/9):0;
  const carbs=base.kcal?Math.round(Math.max(base.kcal-base.prot*4-fat*9,0)/4):0;
  const fast=base.su||base.kcal===0;
  return {kcal:base.kcal+(fast?0:a.k),prot:base.prot,carbs:carbs+(fast?0:a.c),fat,
          water:Math.round((base.wat+a.w)*4)/4,adj:fast?{k:0,c:0,w:a.w,maxEnd:0}:a,fast}}
function fuelItems(di,l){
  const a=actAdj(l); if(!di||di.su||di.kcal===0||a.c<25) return [];
  const names=(l.acts||[]).filter(x=>END.has(x.type)).map(x=>x.type).join(' + ')||'session';
  const items=[]; const C=a.c;
  const mk=(id,label,food,cg,pg)=>items.push({id,type:label,food,kcal:cg*4+pg*4,prot:pg,carbs:cg});
  if(a.maxEnd>=75){
    const pre=Math.round(C*0.4), dur=Math.round(C*0.25);
    mk('f_pre','Fuel · pre','Oats + banana or bread & honey, before '+names,pre,0);
    mk('f_dur','Fuel · during','Isotonic drink / gel / banana (aim 30–60 g carbs per hour)',dur,0);
    mk('f_post','Fuel · post','Rice, potatoes or pasta portion + protein — recovery',C-pre-dur,20);
  }else{
    const pre=Math.round(C*0.45);
    mk('f_pre','Fuel · pre','Banana or bread & honey, before '+names,pre,0);
    mk('f_post','Fuel · post','Rice / potato portion + protein, after '+names,C-pre,20);
  }
  return items;
}
function resetFuel(l){l.fuelSt={};l.meals=l.meals.filter(m=>!String(m.id).startsWith('L_f_'))}

/* materialize editable copies of the plan on first use */
function resolveFood(fi,q){const f=DATA.foods[fi];return {name:f.n,qty:q,por:f.por,
  kcal:Math.round(f.kcal*q),p:Math.round(f.p*q*10)/10,c:Math.round(f.c*q*10)/10,f:Math.round(f.f*q*10)/10}}
function matMeals(di,l){
  if(!di)return;
  if(l.planMeals){
    if(l.planMeals.length&&!l.planMeals[0].items){ // migrate older flat rows
      l.planMeals=l.planMeals.map(p=>({id:p.id,type:p.type,note:p.note||'',status:p.status,
        items:[Object.assign({id:'i0'},{name:p.food,qty:1,por:'',kcal:p.kcal||0,p:p.prot||0,c:0,f:0})]}));
    }
    return;
  }
  l.planMeals=di.M2.filter(m=>m.type!=='Hydration').map((m,i)=>({id:'m'+i,type:m.type,note:m.note||'',status:'planned',
    items:m.items.map((it,j)=>Object.assign({id:'i'+j},resolveFood(it.fi,it.q)))}));
}
const mT=m=>{const t={kcal:0,p:0,c:0,f:0};for(const it of m.items){t.kcal+=it.kcal;t.p+=it.p;t.c+=it.c;t.f+=it.f}
  t.kcal=Math.round(t.kcal);t.p=Math.round(t.p);t.c=Math.round(t.c);t.f=Math.round(t.f);return t};
const mealName=m=>{const n=m.items.length;return n?m.items[0].name+(n>1?' + '+(n-1)+' more':''):m.type};
function refreshEaten(l,meal){
  const li=l.meals.findIndex(x=>x.id==='L_'+meal.id);
  if(meal.status!=='eaten'){if(li>=0)l.meals.splice(li,1);return}
  if(!meal.items.length){meal.status='planned';if(li>=0)l.meals.splice(li,1);return}
  const t=mT(meal), e={id:'L_'+meal.id,t:meal.type,name:mealName(meal),kcal:t.kcal,p:t.p,c:t.c,f:t.f,src:'plan'};
  if(li>=0)l.meals[li]=e;else l.meals.push(e);
}
async function withMeals(ds,fn){const di=dayInfo(ds)||dayInfo(DATA.start),l=await getLog(ds);matMeals(di,l);fn(l);await saveLog(ds,l);render()}
function matWorkout(di,l){
  if(l.workout||!di)return;
  l.workout=di.T.ex.map((e,i)=>({id:'e'+i,block:e[0],name:e[1],rx:e[2],eq:e[3],done:!!(l.done&&l.done[i]),actual:'',rpe:0}));
}

async function callClaude(content,maxTokens){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,messages:[{role:'user',content}]})});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||data.error.type||'API error');
  return (data.content||[]).map(b=>b.type==='text'?b.text:'').join('');
}
function parseJSONish(txt){
  txt=txt.replace(/```json|```/g,'').trim();
  return JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
}

`You are a sports nutritionist. The user wants to replace one item in a planned meal.

Remaining today vs targets: kcal ${tg.kcal-tot.kcal}, protein ${tg.prot-tot.p} g, carbs ${tg.carbs-tot.c} g, fat ${tg.fat-tot.f} g.
Food database (name|portion|kcal|P|C|F):
${dbList}
Pick the 3 best replacements FROM THE DATABASE ONLY (exact names), similar role & macros, fitting the meal and remaining targets. Vary the options. Reply ONLY minified JSON: {"suggestions":[{"name":"exact db name","qty":1,"why":"short reason"}]} with qty as portion multiplier (0.5 steps).`}],800);

function pickPhoto(e){
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    const mx=1024, sc=Math.min(1,mx/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    pendingPhoto=cv.toDataURL('image/jpeg',0.8).split(',')[1];
    URL.revokeObjectURL(url); aiRes=null; view='log'; render(); analyze();
  };
  img.onerror=()=>{toast('Could not read that image','bad')};
  img.src=url;
}
async function analyze(){
  if(!pendingPhoto||analyzing)return;
  if(!apiKey){toast('Add your Anthropic API key in ⚙ to enable AI analysis','warn');openSettings();return}
  analyzing=true; render();
  try{
    const txt=await callClaude([
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:pendingPhoto}},
      {type:'text',text:'Estimate the nutrition of the meal in this photo for the entire visible portion. Reply with ONLY minified JSON, no markdown, no extra text, exactly this shape: {"name":"short dish name","portion":"portion estimate","kcal":0,"protein_g":0,"carbs_g":0,"fat_g":0,"confidence":"low|medium|high","note":"one short sentence on what you see / assumptions"}. Integers for numbers. If it is not food, use name "Not food" and zeros.'}
    ],1000);
    const j=parseJSONish(txt);
    aiRes={name:j.name||'',portion:j.portion||'',kcal:num(j.kcal),protein_g:num(j.protein_g),carbs_g:num(j.carbs_g),fat_g:num(j.fat_g),confidence:j.confidence||'medium',note:j.note||''};
    toast('Estimated — review and save','info');

async function saveMeal(){
  const name=($('#fName').value||'Meal').trim(), kcal=num($('#fK').value), p=num($('#fP').value), c=num($('#fC').value), f=num($('#fF').value);
  if(!kcal&&!p&&!c&&!f){toast('Add at least one value','warn');return}
  const ds=todayStr(), l=await getLog(ds);
  l.meals.push({id:uid(),t:$('#fType').value,name,kcal,p,c,f,src:aiRes?'ai':'manual'});

async function afterSaveAlerts(ds){
  const l=await getLog(ds), di=dayInfo(ds), tg=dayTargets(di,l), t=totals(l), fl=statusFlags(t,tg);
  if(fl.overK){toast('⚠️ Over daily calories by '+(t.kcal-tg.kcal)+' kcal','bad');return true}
  if(fl.overC){toast('Carbs over target ('+t.c+'g / '+tg.carbs+'g)','warn');return true}
  if(fl.overF){toast('Fat over target ('+t.f+'g / '+tg.fat+'g)','warn');return true}
  if(fl.protOk){toast('💪 Protein target reached: '+t.p+' g','ok');return true}
  if(fl.nearK){toast((tg.kcal-t.kcal)+' kcal left today','warn');return true}
  return false;
}

async function setRpe(ds,eid,n){await withWo(ds,l=>{const e=l.workout.find(x=>x.id===eid);if(e)e.rpe=e.rpe===n?0:n})}
async function rmEx(ds,eid){await withWo(ds,l=>{l.workout=l.workout.filter(x=>x.id!==eid)})}
async function saveNote(ds){const l=await getLog(ds);l.note=$('#woNote').value;await saveLog(ds,l);toast('Note saved ✓','ok')}

/* extra sessions */
function openActSheet(ds){
  $('#sheet').innerHTML=`<div class="row" style="margin-bottom:6px"><h2 class="grow" style="font-size:20px">Extra session · ${nice(ds)}</h2>
      <button class="pill" onclick="closeSheet()">Close</button></div>
    <div class="small">Scheduling an endurance session raises that day's calorie & carb targets and adds a fuel plan to the meals.</div>
    <label class="f">Activity</label>
    <select id="acType">${ACT_TYPES.map(([t,i])=>`<option value="${t}">${i} ${t}</option>`).join('')}</select>
    <div class="g2">
      <div><label class="f">Duration (min)</label><input type="number" id="acMin" inputmode="numeric" value="60"></div>
      <div><label class="f">Intensity</label><select id="acInt">${INTS.map(x=>`<option ${x==='moderate'?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <label class="f">When</label>
    <select id="acTod">${['Morning','Afternoon','Evening'].map(x=>`<option ${x==='Evening'?'selected':''}>${x}</option>`).join('')}</select>
    <button class="btn" style="margin-top:16px" onclick="addAct('${ds}')">Add session</button>`;
  $('#ovl').style.display='block'; $('#sheet').classList.add('open');
}
async function addAct(ds){
  const type=$('#acType').value, min=num($('#acMin').value), it=$('#acInt').value, tod=$('#acTod').value;
  if(!min){toast('Set a duration','warn');return}
  const l=await getLog(ds);
  l.acts.push({id:uid(),type,min,intensity:it,tod,done:false});
  resetFuel(l);
  await saveLog(ds,l); closeSheet();
  const a=actAdj(l);
  toast(`Added · targets ${ds===todayStr()?'today':nice(ds)}: +${a.k} kcal${a.c?', +'+a.c+' g carbs':''}`,'ok');
  render();
}
async function rmAct(ds,id){
  const l=await getLog(ds);
  l.acts=l.acts.filter(a=>a.id!==id);
  resetFuel(l);
  await saveLog(ds,l); render();
}
async function toggleAct(ds,id){
  const l=await getLog(ds);
  const a=l.acts.find(x=>x.id===id); if(a)a.done=!a.done;
  await saveLog(ds,l); render();
}

/* exercise picker (add to a day) */
function openPicker(ds){
  const chips=DATA.mods.map(([id,lb])=>`<button class="${libMod===id?'on':''}" onclick="libMod='${id}';openPicker('${ds}')">${lb}</button>`).join('');
  const cats=DATA.cats.map(([id,label])=>{
    const items=DATA.lib.map((e,li)=>({e,li})).filter(x=>x.e.cat===id&&(libMod==='all'||x.e.mod===libMod)&&(!libQ||x.e.n.toLowerCase().includes(libQ)));
    if(!items.length)return '';
    return `<div class="cath"><h3 style="font-size:14px">${esc(label)} <span class="small">${items.length}</span></h3></div>`+
      items.map(x=>`<div class="item">
        <div class="grow"><div class="nm">${esc(x.e.n)}</div><div class="macros">${esc(x.e.rx)}${x.e.eq&&x.e.eq!=='Bodyweight'?' · '+esc(x.e.eq):''}</div></div>
        <button class="icoBtn add" onclick="pickAdd('${ds}',${x.li})">＋</button></div>`).join('');
  }).join('');
  $('#sheet').innerHTML=`<div class="row" style="margin-bottom:8px"><h2 class="grow" style="font-size:20px">Add exercise</h2>
      <button class="pill" onclick="closeSheet()">Close</button></div>
    <div class="g2" style="margin-bottom:8px">
      <select id="pkBlock">${BLOCKS.map(b=>`<option ${b==='Integrated WOD'?'selected':''}>${b}</option>`).join('')}</select>
      <input type="text" placeholder="Search…" value="${esc(libQ)}" oninput="libQ=this.value.toLowerCase();openPicker('${ds}')">
    </div>
    <div class="wkpills">${chips}</div>
    <div class="detail" style="margin-bottom:6px">
      <div class="tag" style="margin-bottom:6px">Or a custom exercise</div>
      <input type="text" id="cxName" placeholder="Name (e.g. Ring dip)">
      <input type="text" id="cxRx" placeholder="Prescription (e.g. 3 × 8)" style="margin-top:8px">
      <button class="pill" style="margin-top:8px;padding:9px 14px" onclick="addCustomEx('${ds}')">Add custom</button>
    </div>
    ${cats}`;
  $('#ovl').style.display='block'; $('#sheet').classList.add('open');
}
async function pickAdd(ds,li){
  const e=DATA.lib[li], blk=$('#pkBlock').value;
  await withWo(ds,l=>{l.workout.push({id:uid(),block:blk,name:e.n,rx:e.rx,eq:e.eq,done:false,actual:'',rpe:0})});
  toast('Added to '+blk+' — tap it to adjust','ok');
}
async function addCustomEx(ds){
  const n=($('#cxName').value||'').trim(); if(!n){toast('Give it a name','warn');return}
  const rx=($('#cxRx').value||'').trim()||'—', blk=$('#pkBlock').value;
  await withWo(ds,l=>{l.workout.push({id:uid(),block:blk,name:n,rx,eq:'',done:false,actual:'',rpe:0})});
  $('#cxName').value='';$('#cxRx').value='';
  toast('Added to '+blk,'ok');
}

/* ================= PLAN ================= */
async function rPlan(){
  const ti=dayInfo(todayStr()); const cw=ti?ti.week:null;
  let pills='';for(let w=1;w<=12;w++)pills+=`<button class="${w===planWeek?'on':''}" onclick="planWeek=${w};render()">W${w}${w===cw?' •':''}</button>`;
  const wk=[];
  DATA.days.forEach((d,i)=>{if(d.week===planWeek)wk.push(i)});
  const logs={};
  for(const i of wk){const ds=dateOf(i);logs[ds]=await getLog(ds)}
  let rows='';
  const TYICO={'Integrated Training':'🤸','Full Kettlebell Training':'🏋️','Zone 2 Walk':'🚶','Conditioning / Mobility':'🧘','Fasting / Training Suspended':'⏳','Refeed / Recovery':'🍽','Review / Measurement':'📏'};
  for(const i of wk){
    const d=DATA.days[i], ds=dateOf(i), today=ds===todayStr(), acts=logs[ds].acts||[];
    const badge=acts.length?` · ${acts.map(a=>actIcon(a.type)).join('')} ${acts.reduce((s,a)=>s+a.min,0)}′`:'';
    const fast=d.kcal===0;
    rows+=`<button class="dayrow" onclick="trainDate='${ds}';go('train')">
      <div class="dow"><span>${d.dow.slice(0,3)}</span><b style="${today?'color:var(--acc)':''}">${new Date(ds+'T00:00:00').getDate()}</b></div>
      <div class="grow"><div class="nm">${TYICO[d.ty]||''} ${esc(d.ty)}${fast?' · '+esc(d.fs):''}</div>
        <div class="macros">${d.min} min${badge} · 🍽 ${fast?'fasting — 0':d.kcal} kcal · ${d.prot} g protein · 💧 ${d.wat} L</div></div>
      <div class="small">›</div></button>`;
  }
  const phase=DATA.days.find(d=>d.week===planWeek).phase;
  $('#main').innerHTML=`<div class="hero"><div class="big" style="font-size:30px">12-week plan</div>
      <div class="small">Started ${nice(DATA.start)} · phase: <b>${esc(phase)}</b> · tap a day to open or schedule extra sessions</div></div>
    <div class="wkpills">${pills}</div>
    <div class="card">${rows}</div>`;
}

/* ================= COACH ================= */
async function collectWeek(){
  const t0=Math.min(Math.max(idx(todayStr()),0),N-1);
  const days=[];
  for(let i=Math.max(0,t0-6);i<=t0;i++){
    const ds=dateOf(i), di=dayInfo(ds), l=await getLog(ds);
    if(!di)continue;
    const wo=(l.workout||[]).map(e=>({name:e.name,block:e.block,planned:e.rx,done:e.done,actual:e.actual||undefined,rpe:e.rpe||undefined}));
    const pm=(l.planMeals||[]);
    const tg=dayTargets(di,l);
    const dd={date:ds,dow:di.dow,week:di.week,phase:di.phase,day_type:di.ty,fasting:di.fs,training_suspended:!!di.su,focus:di.sm,planned_min:di.min,targets:{kcal:di.kcal,prot:di.prot,water:di.wat},
      workout:wo.length?wo:undefined,
      extra_sessions:(l.acts&&l.acts.length)?l.acts.map(a=>({type:a.type,min:a.min,intensity:a.intensity,when:a.tod,done:a.done,est_kcal:actKcal(a)})):undefined,
      targets_today:{kcal:tg.kcal,carbs:tg.carbs},
      meals:{eaten_from_plan:pm.filter(p=>p.status==='eaten').map(p=>p.type),
             skipped_from_plan:pm.filter(p=>p.status==='skipped').map(p=>p.type+': '+(p.items&&p.items[0]?p.items[0].name:'')),
             plan_edits:pm.filter(p=>p.items).map(p=>p.type+' '+p.items.length+' items').join(', ')||undefined,
             extra_logged:l.meals.filter(m=>!String(m.id).startsWith('L_')).map(m=>({n:m.name,kcal:m.kcal,p:m.p})),
             totals:totals(l), water_l:l.water||0},
      note:l.note||undefined};
    days.push(dd);
  }
  return days;
}
async function runCoach(){
  if(coachBusy)return;
  if(!apiKey){toast('Add your Anthropic API key in ⚙ first','warn');openSettings();return}
  const days=await collectWeek();
  const any=days.some(d=>(d.workout&&d.workout.some(e=>e.done||e.actual||e.rpe))||d.meals.totals.kcal>0);
  if(!any){toast('Log at least one day of training or food first','warn');return}
  coachBusy=true; render();
  try{
    const payload={targets:settings,week_data:days};
    const txt=await callClaude([{type:'text',text:
`You are an experienced HIFT/calisthenics strength coach and sports nutritionist reviewing a 51-year-old recreational athlete's week in a 12-week integrated program (Zone 2 base + kettlebell/barbell strength + calisthenics). He also does extra endurance sessions (cycling, swimming); on those days the app already raises kcal/carb targets to fuel them (targets_today shows the adjusted values, ~60% of extra energy as carbs). The plan now includes 36h fasts (weeks 3/6/9) and one 48h fast (week 12) with training suspended and a refeed/recovery day after — never advise training or eating inside a planned fasting window, judge those days by hydration and how the fast felt, and treat refeed days as deliberate recovery, not underperformance. Data (planned vs actually done, RPE 1-10, extra sessions, meals, macro totals vs adjusted targets):
${JSON.stringify(payload)}
Give practical, safe, encouraging recommendations for the NEXT sessions. Where RPE >= 9 or reps fell short, suggest concrete scaling (fewer reps, lighter load, easier variation); where RPE <= 6 and all done, suggest small progressions (+1-2 reps, +2-4 kg, harder variation). Consider interference: if a hard ride/swim precedes a strength day, advise on ordering or scaling. Flag protein shortfalls, under-fueling on endurance days, or calorie overshoots plainly. Reply with ONLY minified JSON, no markdown: {"headline":"one short sentence","wins":["…"],"flags":["…"],"training_adjustments":[{"target":"exercise or area","change":"specific adjustment","why":"short reason"}],"nutrition_advice":["…"],"next_week_focus":"2-3 sentences"} . Max 4 items per list.`}],1500);
    const j=parseJSONish(txt);
    lastCoach={d:todayStr(),j};
    await stSet('coach:latest',lastCoach);
    coachBusy=false; showCoach();
  }catch(err){
    coachBusy=false;
    toast(keyErr(err)?'API key rejected — check it in ⚙':'Coach review failed — try again','bad');
    render();
  }
}
function showCoach(){
  if(!lastCoach){toast('No review yet','warn');return}
  const j=lastCoach.j;
  const li=a=>(a||[]).map(x=>`<div class="item"><div class="grow"><div class="nm" style="font-weight:600">${esc(x)}</div></div></div>`).join('');
  const adj=(j.training_adjustments||[]).map(a=>`<div class="item"><div class="grow">
      <div class="nm">${esc(a.target)}</div>
      <div class="macros" style="color:var(--acc);font-weight:700">${esc(a.change)}</div>
      <div class="small">${esc(a.why)}</div></div></div>`).join('');
  $('#sheet').innerHTML=`<div class="row" style="margin-bottom:6px"><h2 class="grow" style="font-size:20px">🧠 Coach review</h2>
      <button class="pill" onclick="closeSheet()">Close</button></div>
    <div class="small">${nice(lastCoach.d)} · based on your last 7 days</div>
    <h3 style="font-size:17px;margin:10px 0 4px">${esc(j.headline||'')}</h3>
    ${j.wins&&j.wins.length?`<div class="tag" style="margin-top:12px;color:var(--ok)">Wins</div>${li(j.wins)}`:''}
    ${j.flags&&j.flags.length?`<div class="tag" style="margin-top:12px;color:var(--bad)">Watch out</div>${li(j.flags)}`:''}
    ${adj?`<div class="tag" style="margin-top:12px;color:var(--acc)">Adjust next sessions</div>${adj}`:''}
    ${j.nutrition_advice&&j.nutrition_advice.length?`<div class="tag" style="margin-top:12px">Nutrition</div>${li(j.nutrition_advice)}`:''}
    ${j.next_week_focus?`<div class="tag" style="margin-top:12px">Next week</div><p style="margin:6px 0 0;font-size:14px">${esc(j.next_week_focus)}</p>`:''}
    <div class="small" style="margin-top:14px">Apply changes yourself via Train → ✎ Edit (add/remove/swap exercises). General guidance, not medical advice.</div>
    <button class="btn sec" style="margin-top:12px" onclick="closeSheet();runCoach()">↻ Refresh review</button>`;
  $('#ovl').style.display='block'; $('#sheet').classList.add('open');
}

/* ================= SETTINGS ================= */
function openSettings(){
  $('#sheet').innerHTML=`<div class="row" style="margin-bottom:6px"><h2 class="grow" style="font-size:20px">Settings</h2>
      <button class="pill" onclick="closeSheet()">Close</button></div>
    <div class="small">Calorie, protein and water targets now come from the plan and change day by day — fasting days drop to zero automatically. Extra sessions still raise the targets on normal days.</div>
    <div class="g2" style="margin-top:8px">
      <div><label class="f">Body weight (kg)</label><input type="number" id="sWt" inputmode="numeric" value="${settings.weight}"></div>
      <div></div>
    </div>
    <div class="small" style="margin-top:6px">Weight drives the energy estimates for extra sessions (cycling, swimming…).</div>
    <label class="f">Anthropic API key (photo analysis + coach)</label>
    <input type="text" id="sKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(apiKey)}">
    <div class="small" style="margin-top:6px">Create one at console.anthropic.com → API keys. It's stored only on this device and sent only to api.anthropic.com.</div>
    <button class="btn" style="margin-top:16px" onclick="saveSettings()">Save</button>
    <div class="small" style="margin-top:14px">📲 <b>Install:</b> open this page in Safari → Share → <b>Add to Home Screen</b>.</div>`;
  $('#ovl').style.display='block'; $('#sheet').classList.add('open');
}
function closeSheet(){$('#ovl').style.display='none';$('#sheet').classList.remove('open')}
async function saveSettings(){
  settings={weight:num($('#sWt').value)||defaults.weight};
  apiKey=$('#sKey').value.trim();
  await stSet('settings',settings); await stSet('apikey',apiKey);
  closeSheet(); toast('Saved ✓','ok'); render();
}

/* ================= toast ================= */
let toastT=null;
function toast(msg,kind){const t=$('#toast');t.className=kind;t.textContent=msg;t.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200)}

boot();
</script>
